# action_horizon: number of actions predicted by the action head per call.
# execution_horizon: number of predicted actions committed per call (when supported).
# vlm_refresh_interval: control steps between upper VLM refreshes.
# These are distinct; the pilot applies one action per control step and refreshes MiniCPM every 8 steps.
run_id: minicpm_gr00t_dual_asy_libero
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_MiniCPM_DualAsy
is_debug: false

framework:
  name: MiniCPMGR00TDualAsy
  qwenvl:
    base_vlm: /data/tzq/datasets/starVLA/playground/Pretrained_models/MiniCPM-V-4.6
    attn_implementation: sdpa
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    past_action_window_size: 0
    repeated_diffusion_steps: 2
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    connect_layer_index: -1
    diffusion_model_cfg:
      cross_attention_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vlm_refresh_interval: 8
  # Runtime wall-clock delay is measured; no universal fixed L is assumed.
  # Offline wall-clock training needs a prior trace via --training-alignment-trace.
  async_alignment:
    mode: wall_clock
    fixed_latency_steps: null
    trace_path: null
    # Required for offline LeRobot anchors when mode=wall_clock. Set this to a
    # prior rollout comparison.json; dataset sampling replays its exact source schedule.
    training_trace_path: null
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /data/tzq/datasets/starVLA/Datasets/libero_10hz
    data_mix: libero_goal
    include_state: false
    image_size: 224
    obs_image_size: [224, 224]
    action_type: delta_ee # xyz + Euler-angle command deltas and gripper
    per_device_batch_size: 1
    num_workers: 4
    video_backend: torchvision_av

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 1000000
  learning_rate:
    base: 2.5e-5
    action_model: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: qwen_vl_interface,dino_encoder
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 1.0e-8
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
  save_format: pt
